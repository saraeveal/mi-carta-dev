<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zono - Frontend Bandit</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="carta legendaria">

        <div class="rareza">Rareza: Legendaria</div>

        <header>
            <h1>Zono</h1>
            <h2>Frontend Bandit</h2>
        </header>

        <div class="avatar">
            🥷
        </div>

        <section>
            <h3>Estadísticas</h3>

            <p>HTML</p>
            <div class="barra">
                <div class="progreso html"></div>
            </div>

            <p>CSS</p>
            <div class="barra">
                <div class="progreso css"></div>
            </div>

            <p>JavaScript</p>
            <div class="barra">
                <div class="progreso js"></div>
            </div>
        </section>

        <section>
            <h3>⚡ Habilidad Especial</h3>

            <h4>Dash de Medianoche</h4>

            <p>
                Canaliza la energía de las horas nocturnas para acelerar el desarrollo,
                mejorar la concentración y esquivar bugs antes de que aparezcan en producción.
            </p>
        </section>

        <button id="btn-activar">
            Activar habilidad
        </button>

        <p id="contador">
            Activada 0 veces
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
